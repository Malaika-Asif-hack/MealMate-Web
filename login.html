<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate – Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="card auth-card">
            <div class="logo-small">🍽️</div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to continue your health journey</p>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="input-field" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary btn-full">Login</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="register.html" class="login-link">Sign Up</a>
            </p>
            <p class="auth-footer">
                <a href="#" class="forgot-link">Forgot Password?</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        © 2026 MealMate | All rights reserved
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
    
    <!-- Your Firebase config -->
    <script src="firebase-config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (typeof auth === 'undefined') {
                    alert('Firebase is still loading. Please wait.');
                    return;
                }
                
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    alert('Login failed: ' + error.message);
                }
            });
        });
    </script>
</body>
</html>
