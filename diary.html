<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate – Meal Diary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F5F7FA;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #E0E0E0;
            padding: 24px 20px;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid #E0E0E0;
            margin-bottom: 24px;
        }

        .sidebar-logo { font-size: 32px; }
        .sidebar-header h2 { color: #4CAF50; font-size: 24px; }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: block;
            padding: 12px 16px;
            color: #2C3E50;
            text-decoration: none;
            border-radius: 12px;
            transition: all 200ms ease;
        }

        .nav-link:hover { background: #E8F5E9; color: #4CAF50; }
        .nav-link.active { background: #4CAF50; color: white; }
        .logout-link { color: #F44336; margin-top: 20px; cursor: pointer; }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 32px 40px;
        }

        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            color: #2C3E50;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .page-header p {
            color: #7F8C8D;
            font-size: 14px;
        }

        .diary-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #E0E0E0;
        }

        .diary-filters {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filter-group {
            flex: 1;
            min-width: 150px;
        }
        .filter-group label {
            display: block;
            font-size: 12px;
            color: #7F8C8D;
            margin-bottom: 4px;
        }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            font-family: inherit;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-secondary {
            background: transparent;
            color: #4CAF50;
            padding: 10px 24px;
            border: 2px solid #4CAF50;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }

        .diary-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #E8F5E9;
            padding: 16px 24px;
            border-radius: 16px;
            text-align: center;
            flex: 1;
        }
        .stat-label {
            font-size: 12px;
            color: #7F8C8D;
            display: block;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #4CAF50;
            display: block;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #E0E0E0;
        }
        th {
            background: #F8F9FA;
            font-weight: 600;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            margin: 0 4px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .edit-btn { background: #2196F3; color: white; }
        .delete-btn { background: #F44336; color: white; }

        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .main-content { margin-left: 200px; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">🍽️</span>
                <h2>MealMate</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
                <a href="add-meal.html" class="nav-link">➕ Add Meal</a>
                <a href="diary.html" class="nav-link active">📔 Meal Diary</a>
                <a href="weekly-report.html" class="nav-link">📈 Reports</a>
                <a href="profile.html" class="nav-link">👤 Profile</a>
                <a href="settings.html" class="nav-link">⚙️ Settings</a>
                <a href="#" class="nav-link logout-link" onclick="logout()">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>📔 Meal History</h1>
                <p>View all your logged meals</p>
            </div>

            <div class="diary-card">
                <div class="diary-filters">
                    <div class="filter-group">
                        <label>Start Date</label>
                        <input type="date" id="startDate" class="input-field">
                    </div>
                    <div class="filter-group">
                        <label>End Date</label>
                        <input type="date" id="endDate" class="input-field">
                    </div>
                    <button onclick="loadDiary()" class="btn-primary">Filter</button>
                    <button onclick="resetFilters()" class="btn-secondary">Reset</button>
                </div>

                <div class="diary-stats">
                    <div class="stat-box">
                        <span class="stat-label">Total Meals</span>
                        <span id="totalMeals" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Total Calories</span>
                        <span id="totalDiaryCalories" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Average per Meal</span>
                        <span id="avgCalories" class="stat-value">0</span>
                    </div>
                </div>

                <div class="table-container">
                    <table id="diaryTable">
                        <thead>
                            <tr><th>Date</th><th>Meal Type</th><th>Food</th><th>Calories</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="diaryList">
                            <tr><td colspan="5" style="text-align:center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCPUEDslDEvjKXuGrBS_YdBCrJpCpZcLPU",
            authDomain: "mealmate-e2b00.firebaseapp.com",
            projectId: "mealmate-e2b00",
            storageBucket: "mealmate-e2b00.firebasestorage.app",
            messagingSenderId: "206966216973",
            appId: "1:206966216973:web:0bed3f2924d71278e4b844"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function getMealIcon(type) {
            const icons = { breakfast: '🍳', lunch: '🥗', dinner: '🍲', snack: '🍎' };
            return icons[type] || '🍽️';
        }

        async function loadDiary() {
            const user = auth.currentUser;
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            const tbody = document.getElementById('diaryList');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Loading...</td></tr>';
            
            try {
                // Get ALL meals for this user (no date filter initially)
                let query = db.collection('meals').where('userId', '==', user.uid);
                
                const snapshot = await query.get();
                
                let meals = [];
                snapshot.forEach(doc => {
                    meals.push({ id: doc.id, ...doc.data() });
                });
                
                // Filter by date range in JavaScript (easier than Firebase composite queries)
                let filteredMeals = meals;
                
                if (startDate) {
                    filteredMeals = filteredMeals.filter(m => m.date >= startDate);
                }
                if (endDate) {
                    filteredMeals = filteredMeals.filter(m => m.date <= endDate);
                }
                
                // Sort by date (newest first)
                filteredMeals.sort((a, b) => b.date.localeCompare(a.date));
                
                if (filteredMeals.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">No meals found</td></tr>';
                    document.getElementById('totalMeals').textContent = '0';
                    document.getElementById('totalDiaryCalories').textContent = '0';
                    document.getElementById('avgCalories').textContent = '0';
                    return;
                }
                
                let totalCalories = 0;
                tbody.innerHTML = '';
                
                filteredMeals.forEach(meal => {
                    totalCalories += meal.calories;
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = meal.date;
                    row.insertCell(1).textContent = getMealIcon(meal.mealType) + ' ' + meal.mealType;
                    row.insertCell(2).textContent = meal.foodName;
                    row.insertCell(3).textContent = meal.calories;
                    row.insertCell(4).innerHTML = `
                        <button class="edit-btn" onclick='editMeal("${meal.id}", "${meal.foodName}", ${meal.calories}, "${meal.mealType}")'>Edit</button>
                        <button class="delete-btn" onclick='deleteMeal("${meal.id}")'>Delete</button>
                    `;
                });
                
                document.getElementById('totalMeals').textContent = filteredMeals.length;
                document.getElementById('totalDiaryCalories').textContent = totalCalories;
                document.getElementById('avgCalories').textContent = Math.round(totalCalories / filteredMeals.length);
                
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Error loading meals: ' + error.message + '</td></tr>';
            }
        }

        window.deleteMeal = async function(mealId) {
            if (confirm('Are you sure you want to delete this meal?')) {
                try {
                    await db.collection('meals').doc(mealId).delete();
                    loadDiary();
                } catch (error) {
                    alert('Error deleting: ' + error.message);
                }
            }
        };

        window.editMeal = async function(mealId, currentFoodName, currentCalories, currentMealType) {
            const newFoodName = prompt('Edit food name:', currentFoodName);
            if (newFoodName) {
                const newCalories = prompt('Edit calories:', currentCalories);
                const newMealType = prompt('Meal type (breakfast/lunch/dinner/snack):', currentMealType);
                
                if (newCalories && newMealType) {
                    try {
                        await db.collection('meals').doc(mealId).update({
                            foodName: newFoodName,
                            calories: parseInt(newCalories),
                            mealType: newMealType.toLowerCase()
                        });
                        loadDiary();
                    } catch (error) {
                        alert('Error editing: ' + error.message);
                    }
                }
            }
        };

        window.resetFilters = function() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            loadDiary();
        };

        window.logout = function() {
            auth.signOut();
            window.location.href = 'login.html';
        };

        // Check auth on page load
        auth.onAuthStateChanged((user) => {
            if (user) {
                loadDiary();
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
