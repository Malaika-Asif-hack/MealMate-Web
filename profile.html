<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate – Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">🍽️</span>
                <h2>MealMate</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
                <a href="add-meal.html" class="nav-link">➕ Add Meal</a>
                <a href="diary.html" class="nav-link">📔 Meal Diary</a>
                <a href="weekly-report.html" class="nav-link">📈 Reports</a>
                <a href="profile.html" class="nav-link active">👤 Profile</a>
                <a href="settings.html" class="nav-link">⚙️ Settings</a>
                <a href="#" onclick="logout()" class="nav-link logout-link">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>👤 My Profile</h1>
                <p>View and manage your personal information</p>
            </div>

            <div class="profile-card">
                <div class="profile-avatar">🍽️</div>
                <form id="profileForm">
                    <div class="input-row">
                        <div class="input-group half">
                            <label>Full Name</label>
                            <input type="text" id="profileName" class="input-field">
                        </div>
                        <div class="input-group half">
                            <label>Email</label>
                            <input type="email" id="profileEmail" class="input-field" disabled>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group half">
                            <label>Age</label>
                            <input type="number" id="profileAge" class="input-field">
                        </div>
                        <div class="input-group half">
                            <label>Weight (kg)</label>
                            <input type="number" id="profileWeight" class="input-field">
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group half">
                            <label>Height (cm)</label>
                            <input type="number" id="profileHeight" class="input-field">
                        </div>
                        <div class="input-group half">
                            <label>Daily Calorie Goal</label>
                            <input type="number" id="profileGoal" class="input-field">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        async function loadProfile() {
            const user = auth.currentUser;
            if (!user) { window.location.href = 'login.html'; return; }

            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('profileName').value = data.name || '';
                document.getElementById('profileEmail').value = user.email;
                document.getElementById('profileAge').value = data.age || '';
                document.getElementById('profileWeight').value = data.weight || '';
                document.getElementById('profileHeight').value = data.height || '';
                document.getElementById('profileGoal').value = data.calorieGoal || 2000;
            }
        }

        const profileForm = document.getElementById('profileForm');
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            await db.collection('users').doc(user.uid).update({
                name: document.getElementById('profileName').value,
                age: parseInt(document.getElementById('profileAge').value) || null,
                weight: parseFloat(document.getElementById('profileWeight').value) || null,
                height: parseFloat(document.getElementById('profileHeight').value) || null,
                calorieGoal: parseInt(document.getElementById('profileGoal').value),
                updatedAt: new Date()
            });
            alert('Profile updated successfully!');
        });

        auth.onAuthStateChanged((user) => { if (user) loadProfile(); else window.location.href = 'login.html'; });
    </script>
</body>
</html>
